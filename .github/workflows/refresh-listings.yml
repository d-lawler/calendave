name: Refresh listings

on:
  schedule:
    - cron: "17 5 * * 1,3,5" # Mon, Wed, Fri, ~6am London
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Research and rewrite listings
        uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude subscription. Create with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Or bill the API instead:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow the instructions in .github/refresh-listings.md exactly.
          claude_args: |
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python3:*)

      - name: Validate data
        run: |
          python3 - <<'PY'
          import json, re, datetime
          ev = json.load(open('data/events.json'))
          json.load(open('data/venues.json'))
          ids = [e['id'] for e in ev]
          assert len(ids) == len(set(ids)), 'duplicate ids'
          for e in ev:
              for k in ['id', 'title', 'venue', 'scene', 'date', 'url', 'blurb', 'tags']:
                  assert e.get(k) not in (None, ''), f"{e.get('id')}: missing {k}"
              assert e['scene'] in ('music', 'cinema', 'art', 'words'), e['id']
              datetime.date.fromisoformat(e['date'])
              if e.get('endDate'):
                  datetime.date.fromisoformat(e['endDate'])
              assert e['url'].startswith('http'), e['id']
          print(f'{len(ev)} events OK')
          PY

      - name: Check the site builds
        run: |
          npm ci
          npm run generate

      - name: Commit and push
        run: |
          if git diff --quiet -- data/; then
            echo "No changes"
            exit 0
          fi
          git config user.name "calendave-bot"
          git config user.email "calendave-bot@users.noreply.github.com"
          git add data/events.json data/venues.json
          git commit -m "Refresh listings $(date -u +%Y-%m-%d)"
          git push
